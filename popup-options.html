        <output class="toast" id="toast" role="status" aria-live="polite"></output>
    </header>

    <main>
        <!-- Background -->
        <section class="group" aria-labelledby="bg-heading">
            <h2 id="bg-heading" data-i18n="sectionBackground"></h2>

            <div class="tiles" role="radiogroup" data-i18n-aria="bgTypeLabel">
                <label class="tile" data-i18n-title="bgTypeColor">
                    <input class="sr-only" type="radio" name="bgType" value="color">
                    <span class="thumb"><span class="swatch" id="thumb-color"></span></span>
                    <span class="tile-label" data-i18n="bgTypeColor"></span>
                </label>
                <label class="tile" data-i18n-title="bgTypeDefault">
                    <input class="sr-only" type="radio" name="bgType" value="default">
                    <span class="thumb"><img src="resources/default_wallpaper.jpg" alt="" decoding="async"></span>
                    <span class="tile-label" data-i18n="bgTypeDefault"></span>
                </label>
                <label class="tile" data-i18n-title="bgTypeCustom">
                    <input class="sr-only" type="radio" name="bgType" value="custom">
                    <span class="thumb">
                        <img id="thumb-custom" alt="" hidden>
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4m0 0L8 8m4-4 4 4M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg>
                    </span>
                    <span class="tile-label" data-i18n="bgTypeCustom"></span>
                </label>
                <label class="tile" data-i18n-title="bgTypePhotosHint">
                    <input class="sr-only" type="radio" name="bgType" value="photos">
                    <span class="thumb">
                        <img id="thumb-photos" alt="" hidden>
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-9 9"/></svg>
                    </span>
                    <span class="tile-label" data-i18n="bgTypePhotos"></span>
                </label>
                <label class="tile" data-i18n-title="bgTypeVideosHint">
                    <input class="sr-only" type="radio" name="bgType" value="videos">
                    <span class="thumb">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10.5 5-3v9l-5-3"/></svg>
                    </span>
                    <span class="tile-label" data-i18n="bgTypeVideos"></span>
                </label>
            </div>

            <!-- Solid color -->
            <div class="panel" data-for="color" hidden>
                <div class="row">
                    <label class="row-label" for="bg-color" data-i18n="bgColorLabel"></label>
                    <div class="row-ctl">
                        <button type="button" class="link-btn" id="bg-color-theme" data-i18n="bgColorTheme"></button>
                        <input type="color" id="bg-color">
                    </div>
                </div>
            </div>

            <!-- Custom image -->
            <div class="panel" data-for="custom" hidden>
                <div class="drop" id="drop-file">
                    <img class="drop-preview" id="custom-preview" alt="" hidden>
                    <div class="drop-body">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4m0 0L8 8m4-4 4 4M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg>
                        <p><span id="drop-hint"></span> <button type="button" class="link-btn" id="browse-img-btn" data-i18n="customBrowse"></button></p>
                    </div>
                    <div class="progress" id="drop-progress" hidden><span></span></div>
                </div>
                <p class="field-error" id="drop-error" role="alert" hidden></p>
                <input type="file" accept="image/*" id="input-file" hidden>
            </div>

            <!-- Dynamic photos / videos -->
            <div class="panel" data-for="photos videos" hidden>
                <div class="row">
                    <span class="row-label" id="quality-label" data-i18n="qualityLabel"></span>
                    <div class="seg" role="radiogroup" aria-labelledby="quality-label">
                        <label data-i18n-title="qualityLowHint"><input class="sr-only" type="radio" name="quality" value="low"><span data-i18n="qualityLow"></span></label>
                        <label data-i18n-title="qualityMedHint"><input class="sr-only" type="radio" name="quality" value="med"><span data-i18n="qualityMed"></span></label>
                        <label data-i18n-title="qualityHighHint"><input class="sr-only" type="radio" name="quality" value="high"><span data-i18n="qualityHigh"></span></label>
                    </div>
                </div>
                <div class="row">
                    <span class="row-hint"><kbd>Alt</kbd> + <kbd>N</kbd></span>
                    <button type="button" class="btn" id="new-bg-btn">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
                        <span data-i18n="newBackground"></span>
                    </button>
                </div>
            </div>

            <!-- Position -->
            <div class="row" id="position-row">
                <span class="row-label" id="position-label" data-i18n="positionLabel"></span>
                <div class="dpad" role="radiogroup" aria-labelledby="position-label">
                    <label class="dpad-top" data-i18n-title="posTop"><input class="sr-only" type="radio" name="align" value="top" data-i18n-aria="posTop"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg></label>
                    <label class="dpad-left" data-i18n-title="posLeft"><input class="sr-only" type="radio" name="align" value="left" data-i18n-aria="posLeft"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></label>
                    <label class="dpad-center" data-i18n-title="posCenter"><input class="sr-only" type="radio" name="align" value="center" data-i18n-aria="posCenter"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/></svg></label>
                    <label class="dpad-right" data-i18n-title="posRight"><input class="sr-only" type="radio" name="align" value="right" data-i18n-aria="posRight"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></label>
                    <label class="dpad-bottom" data-i18n-title="posBottom"><input class="sr-only" type="radio" name="align" value="bottom" data-i18n-aria="posBottom"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></label>
                </div>
            </div>
        </section>

        <!-- Appearance -->
        <section class="group" aria-labelledby="appearance-heading">
            <h2 id="appearance-heading" data-i18n="sectionAppearance"></h2>
            <div class="row">
                <span class="row-label" id="theme-label" data-i18n="themeLabel"></span>
                <div class="seg" role="radiogroup" aria-labelledby="theme-label">
                    <label><input class="sr-only" type="radio" name="theme" value="auto"><span data-i18n="themeAuto"></span></label>
                    <label><input class="sr-only" type="radio" name="theme" value="light"><span data-i18n="themeLight"></span></label>
                    <label><input class="sr-only" type="radio" name="theme" value="dark"><span data-i18n="themeDark"></span></label>
                </div>
            </div>
            <div class="stack">
                <span class="row-label" id="searchbar-label" data-i18n="searchBarLabel"></span>
                <div class="tiles tiles-4" role="radiogroup" aria-labelledby="searchbar-label">
                    <label class="tile">
                        <input class="sr-only" type="radio" name="searchBarStyle" value="classic">
                        <span class="thumb sb-thumb"><span class="mini-bar mini-classic"></span></span>
                        <span class="tile-label" data-i18n="searchBarClassic"></span>
                    </label>
                    <label class="tile">
                        <input class="sr-only" type="radio" name="searchBarStyle" value="glass">
                        <span class="thumb sb-thumb"><span class="mini-bar mini-glass"></span></span>
                        <span class="tile-label" data-i18n="searchBarGlass"></span>
                    </label>
                    <label class="tile">
                        <input class="sr-only" type="radio" name="searchBarStyle" value="solid">
                        <span class="thumb sb-thumb"><span class="mini-bar mini-solid"></span></span>
                        <span class="tile-label" data-i18n="searchBarSolid"></span>
                    </label>
                    <label class="tile">
                        <input class="sr-only" type="radio" name="searchBarStyle" value="none">
                        <span class="thumb sb-thumb"></span>
                        <span class="tile-label" data-i18n="searchBarNone"></span>
                    </label>
                </div>
                <div class="notice" id="searchbar-intro" hidden>
                    <p data-i18n="searchBarIntro"></p>
                    <div class="notice-actions">
                        <button type="button" class="link-btn" id="intro-classic" data-i18n="searchBarIntroUseClassic"></button>
                        <button type="button" class="link-btn muted" id="intro-dismiss" data-i18n="searchBarIntroDismiss"></button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Advanced -->
        <details class="group advanced">
            <summary>
                <h2 data-i18n="sectionAdvanced"></h2>
                <svg class="icon chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </summary>
            <label class="row">
                <span class="row-label" data-i18n="slowLoadNotices"></span>
                <input type="checkbox" role="switch" class="switch" id="slow-notices">
            </label>
            <div class="row">
                <button type="button" class="btn danger" id="reset-btn" data-i18n="resetAll"></button>
            </div>
        </details>
    </main>
